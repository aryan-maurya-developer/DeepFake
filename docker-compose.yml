      context: .
      dockerfile: models/image/universalfakedetect/Dockerfile
    container_name: deepfake-universalfakedetect
    ports:
      - "5004:5004"
    restart: unless-stopped
    environment:
      - MODEL_PORT=5004
      - PRELOAD_MODEL=false
      - MODEL_TIMEOUT=600
      - USE_GPU=false
    networks:
