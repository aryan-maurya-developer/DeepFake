

services:
  api:
    build: ./api
    container_name: deepfake-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./api/meta_model_artifacts:/app/meta_model_artifacts:ro
      - ./config/deepfake_config.json:/app/config/deepfake_config.json:ro
    environment:
      - PORT=8000
      - META_MODEL_ARTIFACTS_DIR=/app/meta_model_artifacts
      - DEEPFAKE_CONFIG_FILE_PATH=/app/config/deepfake_config.json
      # - LOG_LEVEL=debug # Optional: for more verbose API logs
    depends_on:
      - npr_deepfakedetection
      - universalfakedetect
      # Add other future video/audio model service names here
    networks:
      - deepfake-network

  # --- Image Model Services ---
  npr_deepfakedetection:
    build:
      context: .
      dockerfile: models/image/npr_deepfakedetection/Dockerfile
    container_name: deepfake-npr_deepfakedetection
    ports:
      - "5001:5001"
    restart: unless-stopped
    environment:
      - MODEL_PORT=5001
      - PRELOAD_MODEL=false
      - MODEL_TIMEOUT=600
      - USE_GPU=false
    networks:
      - deepfake-network

